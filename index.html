<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מסך לובי — יסוד 9</title>
    <style>
      #boot-error {
        display: none; position: fixed; inset: 0; z-index: 99999;
        background: #12100c; color: #f3e9d2; padding: 24px;
        font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px;
        line-height: 1.7; direction: rtl; overflow: auto;
      }
      #boot-error b { color: #e0b352; display: block; font-size: 20px; margin-bottom: 12px; }
      #boot-error code {
        display: block; margin-top: 14px; padding: 12px; border-radius: 8px;
        background: rgba(255,255,255,0.08); color: #ffd9a0; font-size: 13px;
        white-space: pre-wrap; word-break: break-word; direction: ltr; text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error"></div>

    <!-- מדווח שגיאות טעינה: כתוב ב-ES5 בלבד כדי שירוץ גם בדפדפנים ישנים מאוד -->
    <script>
      /* ─── Polyfills לדפדפנים ישנים (Chrome 81 באנדרואיד 4.4 וכדומה) ───
         נכתב ב-ES5 בלבד ורץ לפני טעינת האפליקציה. */

      /* globalThis — נוסף ב-Chrome 71 */
      if (typeof window.globalThis === 'undefined') { window.globalThis = window; }

      /* String.prototype.replaceAll — נוסף ב-Chrome 85 */
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function (search, replacement) {
          var str = String(this);
          if (Object.prototype.toString.call(search) === '[object RegExp]') {
            var flags = search.flags !== undefined
              ? search.flags
              : (search.global ? 'g' : '') + (search.ignoreCase ? 'i' : '') + (search.multiline ? 'm' : '');
            if (flags.indexOf('g') === -1) {
              throw new TypeError('replaceAll must be called with a global RegExp');
            }
            return str.replace(search, replacement);
          }
          var s = String(search);
          if (s === '') return str;
          if (typeof replacement === 'function') {
            var out = '', from = 0, pos;
            while ((pos = str.indexOf(s, from)) !== -1) {
              out += str.slice(from, pos) + String(replacement(s, pos, str));
              from = pos + s.length;
            }
            return out + str.slice(from);
          }
          return str.split(s).join(String(replacement));
        };
      }

      /* Array/String .at() — נוסף ב-Chrome 92 */
      (function () {
        function at(n) {
          n = Math.trunc(n) || 0;
          if (n < 0) n += this.length;
          if (n < 0 || n >= this.length) return undefined;
          return this[n];
        }
        if (!Array.prototype.at) Array.prototype.at = at;
        if (!String.prototype.at) String.prototype.at = at;
      })();

      /* Object.hasOwn — נוסף ב-Chrome 93 */
      if (!Object.hasOwn) {
        Object.hasOwn = function (obj, key) {
          return Object.prototype.hasOwnProperty.call(obj, key);
        };
      }

      /* Array findLast / findLastIndex — נוספו ב-Chrome 97 */
      if (!Array.prototype.findLastIndex) {
        Array.prototype.findLastIndex = function (fn, thisArg) {
          for (var i = this.length - 1; i >= 0; i--) {
            if (fn.call(thisArg, this[i], i, this)) return i;
          }
          return -1;
        };
      }
      if (!Array.prototype.findLast) {
        Array.prototype.findLast = function (fn, thisArg) {
          var i = this.findLastIndex(fn, thisArg);
          return i === -1 ? undefined : this[i];
        };
      }

      /* structuredClone — נוסף ב-Chrome 98 (גרסה בסיסית מספיקה לנתוני JSON) */
      if (typeof window.structuredClone !== 'function') {
        window.structuredClone = function (v) {
          return v === undefined ? v : JSON.parse(JSON.stringify(v));
        };
      }

      (function () {
        var shown = false;
        function show(title, detail) {
          if (shown) return;
          shown = true;
          var el = document.getElementById('boot-error');
          if (!el) return;
          el.style.display = 'block';
          el.innerHTML = '<b>' + title + '</b>';
          if (detail) {
            var c = document.createElement('code');
            c.appendChild(document.createTextNode(String(detail)));
            el.appendChild(c);
          }
        }
        window.__lobbyBootError = show;
        window.addEventListener('error', function (e) {
          var d = (e && e.message ? e.message : 'unknown');
          if (e && e.filename) d += '\n' + e.filename + ':' + (e.lineno || 0);
          show('שגיאה בטעינת המסך', d);
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('שגיאה בטעינת המסך', 'promise: ' + (e && e.reason ? e.reason : 'unknown'));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            show(
              'המסך לא נטען',
              'ייתכן שגרסת הדפדפן ישנה מדי (נדרש Chrome 67 ומעלה). מומלץ להתקין Chrome עדכני מחנות האפליקציות ולהריץ דרכו.'
            );
          }
        }, 9000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <!-- דפדפן שלא תומך כלל במודולים (ישן מאוד) — הודעה ברורה במקום מסך לבן -->
    <script nomodule>
      window.__lobbyBootError &&
        window.__lobbyBootError(
          'הדפדפן ישן מדי להרצת המסך',
          'הדפדפן לא תומך ב-JavaScript Modules (נדרש Chrome 61 ומעלה).\n\n' +
            '--- פרטי המכשיר (צלמו והעבירו) ---\n' +
            navigator.userAgent
        );
    </script>
  </body>
</html>
